name: build-scarlet

# Pipeline PRD ยง7. Build jalan di runner GitHub, tidak pernah di device.
# mode=check hanya memasang integrasi + memverifikasi config (cepat, tanpa build).
# mode=build menghasilkan Image dan zip AnyKernel3.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = integrasi + verifikasi config + kompilasi terarah; build = sampai Image"
        type: choice
        options: [check, build]
        default: check
      kernel_branch:
        description: "Branch di fork kernel"
        type: string
        default: android12-5.10
      kernel_sha:
        description: "Commit base yang dipin (harus sama dengan tip branch; kalau berbeda, build berhenti)"
        type: string
        default: 98ab0310f2aec486e84d5d60c36d0575dfb5482a
      ksu_sha:
        description: "SHA KernelSU-Next"
        type: string
        default: 896f45a78c0806cfd585c4e14e6989f867b143d7
      susfs_commit:
        description: "Commit susfs4ksu (v2.4.0 = 45a05753)"
        type: string
        default: 45a05753
      nomount_sha:
        description: "SHA NoMount"
        type: string
        default: 6849f00a342b
      push_integration:
        description: "Push hasil integrasi ke branch scarlet/android12-5.10"
        type: boolean
        default: false
      create_release:
        description: "Buat GitHub Release (hanya mode=build)"
        type: boolean
        default: false

concurrency:
  group: build-scarlet-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  KSU_SHA: ${{ inputs.ksu_sha }}
  SUSFS_COMMIT: ${{ inputs.susfs_commit }}
  NOMOUNT_SHA: ${{ inputs.nomount_sha }}
  AK3_SHA: 41f04bdb4ee3
  NEUTRON_TAG: "06092026"
  NEUTRON_ASSET: neutron-clang-06092026.tar.zst

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout repo build
        uses: actions/checkout@v4

      - name: Bebaskan disk + pasang dependensi
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev \
            ccache zip unzip cpio lz4 xz-utils python3 zstd
          df -h /

      - name: Checkout fork kernel
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ inputs.kernel_branch }}" \
            "https://x-access-token:${{ secrets.KERNEL_PAT }}@github.com/VoidPrjct/android_kernel_common-5.10.git" kernel
          cd kernel
          # PRD: setiap komponen dipin. Tanpa ini, pin di VERSIONS.md hanya
          # dokumentasi: kalau branch bergerak, build memakai basis lain tanpa
          # ada yang tahu. Clone memakai --depth 1, jadi kalau tip branch tidak
          # sama dengan pin, commit yang dipin memang tidak ada di clone ini --
          # berhenti dengan pesan jelas, jangan menebak.
          WANT="${{ inputs.kernel_sha }}"
          GOT=$(git rev-parse HEAD)
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::tip branch ${{ inputs.kernel_branch }} adalah $GOT, bukan pin $WANT"
            echo "Perbarui input kernel_sha + VERSIONS.md, lalu jalankan ulang."
            exit 1
          fi
          echo "pin kernel terverifikasi: $GOT"
          echo "KERNEL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          KVER=$(awk -F' = ' '/^VERSION =/{v=$2} /^PATCHLEVEL =/{p=$2} /^SUBLEVEL =/{s=$2} END{print v"."p"."s}' Makefile)
          echo "KVER=$KVER" >> "$GITHUB_ENV"
          echo "kernel $KVER @ $(git rev-parse --short HEAD)"

      - name: Pasang integrasi (KSU-Next + SUSFS + NoMount)
        env:
          KERNEL_DIR: ${{ github.workspace }}/kernel
          WORKDIR: ${{ runner.temp }}/scarlet
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          ./scripts/integrate.sh 2>&1 | tee integration.log

      - name: Cache toolchain Neutron
        uses: actions/cache@v4
        with:
          path: toolchain/neutron
          key: neutron-${{ env.NEUTRON_TAG }}-${{ runner.os }}

      - name: Unduh Neutron Clang
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -x toolchain/neutron/.ok ]; then
            mkdir -p toolchain
            # PRD 6.5: ambil dari daftar asset release, jangan menebak nama.
            gh release view "$NEUTRON_TAG" -R Neutron-Toolchains/clang-build-catalogue --json assets \
              --jq '.assets[].name' | tee toolchain/assets.txt
            gh release download "$NEUTRON_TAG" -R Neutron-Toolchains/clang-build-catalogue \
              -p "$NEUTRON_ASSET" -D toolchain --clobber
            rm -rf toolchain/neutron && mkdir -p toolchain/neutron
            tar --zstd -xf "toolchain/$NEUTRON_ASSET" -C toolchain/neutron
          fi
          # Layout tarball tidak dijamin, dan bin/clang biasanya SYMLINK.
          # Run 44930630905 gagal di sini karena 'find -type f' melewati symlink,
          # padahal bin/clang memang ada. Jadi kandidat diuji dengan benar-benar
          # menjalankannya: itu satu-satunya bukti yang tidak bisa menyesatkan.
          CLANG_BIN=""
          for c in "$PWD/toolchain/neutron/bin/clang" \
                   $(find toolchain/neutron -maxdepth 4 \( -type f -o -type l \) \
                        -name 'clang*' 2>/dev/null | grep -E '/clang(-[0-9]+)?$' | sort -Vr); do
            [ -e "$c" ] || continue
            if "$c" --version >/dev/null 2>&1; then CLANG_BIN="$c"; break; fi
          done
          if [ -z "$CLANG_BIN" ]; then
            echo "tidak ada clang yang bisa dijalankan di dalam tarball"
            find toolchain/neutron -maxdepth 3 -printf '%y %p -> %l\n' | head -40
            exit 1
          fi
          BIN_DIR="$(cd "$(dirname "$CLANG_BIN")" && pwd)"
          # Kernel build dengan LLVM=1 butuh tool LLVM lain di PATH yang sama.
          # Lebih baik gagal sekarang daripada 1 jam kemudian.
          MISSING=""
          for t in llvm-ar llvm-nm llvm-strip llvm-objcopy llvm-objdump ld.lld; do
            "$BIN_DIR/$t" --version >/dev/null 2>&1 || MISSING="$MISSING $t"
          done
          if [ -n "$MISSING" ]; then
            echo "toolchain tidak lengkap:$MISSING"
            ls -l "$BIN_DIR" | head -40
            exit 1
          fi
          echo "NEUTRON_BIN=$BIN_DIR" >> "$GITHUB_ENV"
          export PATH="$BIN_DIR:$PATH"
          clang --version | tee clang-version.txt
          echo "bin dir: $BIN_DIR"
          touch toolchain/neutron/.ok

      - name: Siapkan konfigurasi
        env:
          KERNEL_DIR: ${{ github.workspace }}/kernel
        run: |
          set -euo pipefail
          export PATH="${NEUTRON_BIN}:$PATH"
          cd kernel

          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig

          # dijalankan dari root kernel; fragment ada di repo build
          ARCH=arm64 scripts/kconfig/merge_config.sh -m -O out out/.config "$GITHUB_WORKSPACE/scripts/scarlet.fragment"

          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

          "$GITHUB_WORKSPACE/scripts/verify-config.sh" out/.config

      # Mode check: kompilasi hanya bagian yang paling mungkin salah -- berkas
      # porting kita sendiri dan fs/susfs.c hasil patch 50. Ini menangkap error
      # kompilasi dalam hitungan menit, bukan setelah build penuh.
      - name: Kompilasi terarah (mode check)
        if: inputs.mode == 'check'
        env:
          KERNEL_DIR: ${{ github.workspace }}/kernel
          WORKDIR: ${{ runner.temp }}/scarlet
        run: |
          set -euo pipefail
          export PATH="${NEUTRON_BIN}:$PATH"
          export CCACHE_DIR="$PWD/.ccache"
          export CCACHE_MAXSIZE=5G
          cd kernel
          set -o pipefail
          # Fungsi, bukan variabel: 'CC="ccache clang"' harus tetap satu argumen
          # dan harus lewat command line supaya tidak ditimpa Makefile saat LLVM=1.
          mk() { make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC="ccache clang" "$@"; }
          {
            echo "== make prepare =="
            mk prepare
            # flask.h/av_permissions.h dihasilkan di out/security/selinux oleh
            # aturan di security/selinux/Makefile, dan hanya jadi prasyarat objek
            # SELinux sendiri. objsec.h memakainya, dan objsec.h dipakai berkas
            # KernelSU (termasuk susfs_compat.c) -- tapi kbuild tidak tahu itu.
            # Run 44931389321: 'fatal error: flask.h file not found'.
            # Karena itu direktorinya dibangun lebih dulu, menentukan urutan.
            echo "== security/selinux/ (flask.h + av_permissions.h) =="
            mk security/selinux/
            # Target direktori, bukan 'drivers/kernelsu/kernelsu.o': aturan
            # generik kbuild \$(obj)/%.o: \$(src)/%.c butuh kernelsu.c yang tidak
            # ada (run 44931056217: "No rule to make target .../kernelsu.o").
            # Target direktori membangun seluruh kernelsu-objs, termasuk
            # susfs_compat.c.
            echo "== drivers/kernelsu/ =="
            mk drivers/kernelsu/
            # fs/susfs.o objek tunggal (bukan gabungan), jadi ini target yang sah.
            echo "== fs/susfs.o =="
            mk fs/susfs.o

            # Berkas yang diubah patch 50 ikut dikompilasi. Sebabnya CONFIG_WERROR
            # default y di fork ini, jadi -Werror berlaku global: satu peringatan
            # di fs/exec.c atau kernel/sys.c akan menggagalkan build penuh setelah
            # sekitar satu jam. Daftarnya diturunkan dari patch 50 yang benar-benar
            # dipakai, bukan dari daftar hafalan, supaya tetap benar kalau patch
            # berubah.
            P50="$WORKDIR/susfs4ksu/50.patch"
            [ -f "$P50" ] || { echo "patch 50 tidak ada di $P50"; exit 1; }
            mapfile -t PATCHED < <(grep -E '^diff --git' "$P50" | awk '{print $3}' \
                | sed 's|^a/||' | grep '\.c$' | sed 's/\.c$/.o/' | grep -v '^fs/susfs\.o$')
            [ "${#PATCHED[@]}" -gt 15 ] || { echo "daftar berkas patch 50 mencurigakan kecil: ${#PATCHED[@]}"; exit 1; }
            echo "== berkas yang diubah patch 50 (${#PATCHED[@]}) =="
            printf '   %s\n' "${PATCHED[@]}"
            mk "${PATCHED[@]}"
          } 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          echo "kompilasi terarah OK"

      # ccache tanpanya berarti setiap percobaan membayar ~1 jam lagi dari nol.
      # Dipisah restore/save dengan sengaja: post-step actions/cache dilewati
      # ketika job gagal, jadi cache tidak pernah tersimpan pada build yang gagal
      # -- padahal justru itu yang paling butuh. Simpan eksplisit dengan
      # 'if: always()'. continue-on-error: kegagalan cache tidak boleh
      # menggagalkan build.
      - name: Pulihkan ccache
        if: inputs.mode == 'build'
        id: ccache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ env.KSU_SHA }}-${{ env.SUSFS_COMMIT }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ env.KSU_SHA }}-${{ env.SUSFS_COMMIT }}-
            ccache-${{ env.KSU_SHA }}-
            ccache-

      - name: Bangun kernel
        if: inputs.mode == 'build'
        env:
          KERNEL_DIR: ${{ github.workspace }}/kernel
        run: |
          set -euo pipefail
          export PATH="${NEUTRON_BIN}:$PATH"
          export CCACHE_DIR="$PWD/.ccache"
          export CCACHE_MAXSIZE=5G
          ccache --version | head -1
          cd kernel

          set -o pipefail
          # Menentukan urutan: flask.h/av_permissions.h dihasilkan di
          # out/security/selinux, dan berkas KernelSU membutuhkannya lewat
          # objsec.h. Dengan -j, kbuild tidak tahu hubungan itu, jadi
          # drivers/kernelsu bisa dikompilasi lebih dulu dan gagal.
          # Dibangun lebih dulu; make berikutnya tinggal melanjutkan.
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC="ccache clang" security/selinux/
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC="ccache clang" Image 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Cek hasil build
        if: inputs.mode == 'build'
        run: |
          set -euo pipefail
          ls -l kernel/out/arch/arm64/boot/Image
          ccache -s || true

      # Nama kernel harus 5.10.272-VoidPrjct-Scarlet, tanpa "-g<hash>". Dicek dari
      # out/include/config/kernel.release (ada setelah 'make prepare', jadi berlaku
      # di mode check dan build). Di mode build, banner di dalam Image juga dicek:
      # itu string yang tampil sebagai "Linux version" dan uname -r di device.
      - name: Verifikasi nama kernel
        run: |
          set -euo pipefail
          EXPECT="${KVER}-VoidPrjct-Scarlet"
          REL=$(cat kernel/out/include/config/kernel.release)
          echo "kernel.release = $REL (harus $EXPECT)"
          if [ "$REL" != "$EXPECT" ]; then
            echo "::error::kernel.release '$REL' bukan '$EXPECT'"
            exit 1
          fi
          if [ "${{ inputs.mode }}" = "build" ]; then
            if ! grep -a -F -q "Linux version ${EXPECT} " kernel/out/arch/arm64/boot/Image; then
              echo "::error::banner 'Linux version ${EXPECT}' tidak ada di Image"
              exit 1
            fi
            echo "banner Image OK: Linux version ${EXPECT}"
          fi

      # Diletakkan setelah kompilasi: ccache baru berisi sesuatu setelah build.
      # 'if: always()' supaya build yang gagal pun tetap menyimpan hasil
      # kompilasi sebagian -- post-step actions/cache dilewati saat job gagal,
      # dan justru build yang gagal itu yang paling butuh cache.
      - name: Simpan ccache
        if: always() && inputs.mode == 'build'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Package AnyKernel3
        id: package
        if: inputs.mode == 'build'
        env:
          KERNEL_DIR: ${{ github.workspace }}/kernel
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y%m%d)
          ZIP="$PWD/VoidPrjct-Scarlet-${KVER}-${DATE}.zip"
          KERNEL_VERSION="$KVER" ./scripts/package-anykernel.sh "$KERNEL_DIR" "$ZIP"
          # GITHUB_OUTPUT dipakai untuk langkah berikut yang membutuhkan nilai ini
          # di ekspresi langkah. Nilai dari GITHUB_ENV hanya masuk ke environment
          # proses, bukan ke konteks ekspresi, jadi jangan diandalkan di sana.
          {
            echo "zip=$ZIP"
            echo "tag=scarlet-${KVER}-${DATE}"
            echo "kver=${KVER}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "ZIP_PATH=$ZIP"
            echo "TAG=scarlet-${KVER}-${DATE}"
          } >> "$GITHUB_ENV"

      - name: Unggah artifact (zip)
        if: inputs.mode == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: VoidPrjct-Scarlet-${{ steps.package.outputs.kver }}-${{ github.run_number }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

      - name: Unggah log (walau gagal)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            integration.log
            build.log
            clang-version.txt
          if-no-files-found: warn

      - name: Push branch integrasi ke fork
        # Dinonaktifkan permanen: secret KERNEL_PAT ditolak GitHub
        # ("Invalid username or token", run 45330302392) meski extraheader
        # sudah dikosongkan dan remote di-set ulang. Integrasi tetap bisa
        # dibangun; hasilnya tersimpan sebagai artifact, bukan branch fork.
        if: false && inputs.push_integration && !cancelled()
        env:
          KERNEL_PAT: ${{ secrets.KERNEL_PAT }}
        run: |
          set -euo pipefail
          cd kernel
          git config user.name "VoidPrjct build bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # KernelSU-Next/ dan NoMount/ adalah clone terpisah; jangan ikut di-commit.
          printf 'KernelSU-Next/\nNoMount/\nout/\n' >> .git/info/exclude
          git checkout -B scarlet/android12-5.10
          git add -A
          if git diff --cached --quiet; then
            echo "tidak ada perubahan untuk di-commit"
            exit 0
          fi
          git commit -m "scarlet: integrasi KernelSU-Next ${KSU_SHA:0:12} + SUSFS ${SUSFS_COMMIT} + NoMount ${NOMOUNT_SHA:0:12}"
          # actions/checkout memasang http.https://github.com/.extraheader berisi
          # GITHUB_TOKEN, dan header itu MENIMPA kredensial di URL remote. Token
          # workflow hanya berizin pada repo build, bukan repo kernel, jadi push
          # ditolak "Invalid username or token" (run 45322961107). Header itu
          # dikosongkan untuk perintah ini saja, dan remote diisi ulang dari
          # secret KERNEL_PAT supaya tidak bergantung pada URL hasil clone.
          git remote set-url origin \
            "https://x-access-token:${KERNEL_PAT}@github.com/VoidPrjct/android_kernel_common-5.10.git"
          git -c http.https://github.com/.extraheader= push --force origin \
            HEAD:refs/heads/scarlet/android12-5.10

      - name: Buat rilis
        # Dipisah dari keberhasilan push: Image dan zip sudah jadi sebelum
        # langkah push, jadi kegagalan push tidak boleh membatalkan rilis.
        if: inputs.create_release && inputs.mode == 'build' && !cancelled() && steps.package.outputs.zip != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > RELEASE_NOTES.md <<EOF
          VoidPrjct-Scarlet ${KVER}

          Komponen:
          - KernelSU-Next: ${KSU_SHA}
          - SUSFS: ${SUSFS_COMMIT} (v2.4.0, built-in via patch 50)
          - NoMount: ${NOMOUNT_SHA} (built-in)
          - Kernel base: ${KERNEL_SHA} (${KVER})
          - Neutron Clang: ${NEUTRON_TAG}
          - AnyKernel3: ${AK3_SHA}

          Status uji: BELUM DIUJI DI DEVICE.
          Build hijau tidak berarti boot sukses.

          anykernel.sh memakai do.devicecheck=0. Itu hanya melewati pengecekan
          nama device. Device non-GKI atau beda generasi GKI tetap tidak akan boot.

          Catatan: bagian sisi KernelSU dari patch SUSFS 2.4.0 tidak dipasang
          (tidak cocok dengan KernelSU-Next). Penggantinya kode porting di
          scripts/susfs_compat.c pada repo build.
          EOF
          # Idempoten: tag memuat tanggal, jadi re-run pada hari yang sama akan
          # menabrak rilis yang sudah ada. gh release create langsung gagal di
          # situ, jadi periksa dulu.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "rilis $TAG sudah ada: perbarui aset + catatan"
            gh release upload "$TAG" "$ZIP_PATH" --clobber
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" "$ZIP_PATH" VERSIONS.md \
              --title "VoidPrjct-Scarlet ${KVER}" \
              --notes-file RELEASE_NOTES.md
          fi
          gh release view "$TAG" --json url,tagName,assets \
            --jq '"[release] \(.tagName) \(.url)\n[aset] " + ([.assets[].name] | join(", "))'
