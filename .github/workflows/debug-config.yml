name: debug-config

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Probe kconfig devfreq
        env:
          KERNEL_PAT: ${{ secrets.KERNEL_PAT }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq bison flex bc libssl-dev libelf-dev
          git clone --depth 1 --branch android12-5.10 \
            "https://x-access-token:${KERNEL_PAT}@github.com/VoidPrjct/android_kernel_common-5.10.git" kernel
          cd kernel
          make -j"$(nproc)" O=out ARCH=arm64 gki_defconfig
          echo "=== setelah gki_defconfig ==="
          grep -E "PM_DEVFREQ|DEVFREQ_GOV" out/.config || true
          echo "=== select PM_DEVFREQ ==="
          grep -rn "select PM_DEVFREQ" drivers/ kernel/ arch/ || echo "tidak ada"
          echo "=== coba matikan SIMPLE_ONDEMAND + olddefconfig ==="
          scripts/config --file out/.config -d CONFIG_DEVFREQ_GOV_SIMPLE_ONDEMAND
          make -j"$(nproc)" O=out ARCH=arm64 olddefconfig
          grep -E "DEVFREQ_GOV" out/.config || true
          echo "=== gabung fragment scarlet (simulasi) ==="
          printf '%s\n' \
            'CONFIG_CPU_FREQ_GOV_SCARLET=y' \
            'CONFIG_CPU_FREQ_DEFAULT_GOV_SCARLET=y' \
            '# CONFIG_CPU_FREQ_GOV_PERFORMANCE is not set' \
            '# CONFIG_CPU_FREQ_GOV_POWERSAVE is not set' \
            '# CONFIG_CPU_FREQ_GOV_USERSPACE is not set' \
            '# CONFIG_CPU_FREQ_GOV_ONDEMAND is not set' \
            '# CONFIG_CPU_FREQ_GOV_CONSERVATIVE is not set' \
            '# CONFIG_CPU_FREQ_GOV_SCHEDHORIZON is not set' \
            'CONFIG_DEVFREQ_GOV_SCARLET=y' \
            '# CONFIG_DEVFREQ_GOV_PERFORMANCE is not set' \
            '# CONFIG_DEVFREQ_GOV_SIMPLE_ONDEMAND is not set' \
            '# CONFIG_DEVFREQ_GOV_POWERSAVE is not set' \
            '# CONFIG_DEVFREQ_GOV_USERSPACE is not set' \
            '# CONFIG_DEVFREQ_GOV_PASSIVE is not set' \
            > /tmp/frag-test
          ARCH=arm64 scripts/kconfig/merge_config.sh -m -O out out/.config /tmp/frag-test
          make -j"$(nproc)" O=out ARCH=arm64 olddefconfig
          echo "=== hasil akhir ==="
          grep -E "DEVFREQ_GOV|CPU_FREQ_GOV|CPU_FREQ_DEFAULT" out/.config || true
          echo "=== select SIMPLE_ONDEMAND ==="
          grep -rn "select DEVFREQ_GOV_SIMPLE_ONDEMAND" drivers/ | head
